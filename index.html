<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Radar Editorial — inteligência editorial">
  <title>Radar Editorial</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">INTELIGÊNCIA EDITORIAL</div>
        <h1>Radar Editorial</h1>
      </div>
      <div class="version">Web 0.1.0</div>
    </header>

    <main class="content">
      <section class="hero card">
        <div>
          <span class="badge">MVP</span>
          <h2>O que você quer investigar?</h2>
          <p>
            Crie uma investigação para organizar a próxima etapa do Radar:
            pesquisa, fontes, evidências e análise.
          </p>
        </div>

        <form id="investigation-form" class="investigation-form">
          <label for="title">Tema da investigação</label>
          <textarea
            id="title"
            rows="3"
            maxlength="500"
            placeholder="Ex.: Ansiedade e uso de redes sociais"
            required
          ></textarea>

          <label for="objective">Objetivo <span>(opcional)</span></label>
          <textarea
            id="objective"
            rows="2"
            maxlength="1000"
            placeholder="Ex.: entender tendências, evidências e lacunas editoriais"
          ></textarea>

          <div class="form-footer">
            <span id="counter">0/500</span>
            <button id="submit-button" type="submit">Iniciar investigação</button>
          </div>
        </form>

        <div id="message" class="message hidden" role="status"></div>
      </section>

      <section class="card">
        <div class="panel-heading">
          <div>
            <div class="eyebrow">HISTÓRICO</div>
            <h3>Investigações</h3>
          </div>
          <button id="refresh-button" class="secondary" type="button">Atualizar</button>
        </div>

        <div id="investigation-list" class="list">
          <div class="empty">Carregando...</div>
        </div>
      </section>
    </main>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
