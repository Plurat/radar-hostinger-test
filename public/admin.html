<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração · Radar Editorial</title><link rel="stylesheet" href="/styles.css"></head><body><main class="container"><header class="hero"><div class="eyebrow">RADAR EDITORIAL</div><div class="title-row"><div><h1>Administração</h1><p class="subtitle">Usuários, limites e uso</p></div><div class="badges"><a class="badge-link" href="/">Voltar ao Radar</a><button id="admin-logout" class="secondary">Sair</button></div></div></header><section class="card"><div class="eyebrow">NOVO USUÁRIO</div><h2>Cadastrar usuário</h2><form id="user-form"><div class="admin-grid"><div><label>Nome</label><input id="u-name"></div><div><label>E-mail</label><input id="u-email" type="email" required></div><div><label>Senha</label><input id="u-password" type="password" minlength="8" required></div><div><label>Perfil</label><select id="u-role"><option value="user">Usuário</option><option value="admin">Administrador</option></select></div><div><label>Investigações/mês</label><input id="u-investigations" type="number" min="1" value="10"></div><div><label>Pesquisas Web/mês</label><input id="u-research" type="number" min="1" value="30"></div><div><label>Análises IA/mês</label><input id="u-analysis" type="number" min="1" value="20"></div><div><label>Fontes/pesquisa</label><input id="u-sources" type="number" min="1" value="15"></div></div><div class="form-actions"><button>Cadastrar usuário</button><div id="admin-message" class="message"></div></div></form></section><section class="card"><div class="section-heading"><div><div class="eyebrow">USUÁRIOS</div><h2>Controle de acesso</h2></div><button id="refresh-users" class="secondary">Atualizar</button></div><div id="users-area"></div></section><section class="card"><div class="eyebrow">USO</div><h2>Consumo de IA no mês</h2><div id="usage-area"></div></section></main><script src="/admin.js" defer></script></body></html>
