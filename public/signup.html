<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitar cadastro · Radar Editorial</title><link rel="stylesheet" href="/styles.css"></head><body><main class="auth-container"><section class="card auth-card"><div class="eyebrow">INTELIGÊNCIA EDITORIAL</div><h1>Solicitar cadastro</h1><p class="muted">Crie sua conta. O acesso será liberado após aprovação do administrador.</p><form id="signup-form"><label>Nome</label><input id="name" type="text" required autocomplete="name"><label>E-mail</label><input id="email" type="email" required autocomplete="email"><label>CRP <span>(formato XX/XXXXX)</span></label><input id="crp" type="text" required inputmode="numeric" maxlength="8" placeholder="06/12345" autocomplete="off"><label>Senha</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><label>Confirmar senha</label><input id="confirm-password" type="password" minlength="8" required autocomplete="new-password"><div class="form-actions"><button id="signup-button">Solicitar cadastro</button><div id="signup-message" class="message" aria-live="polite"></div></div></form><p class="auth-footer"><a href="/login">Voltar para o login</a></p></section></main><script src="/signup.js" defer></script></body></html>
